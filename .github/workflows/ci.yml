name: Build ARCH suite
on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Ninja on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Ninja on macOS
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Initialize Ariadne submodule
        shell: bash
        run: git submodule update --init ss/ard
      - name: Configure Ariadne
        shell: bash
        run: cmake -S ss/ard -B build-ariadne -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON_BINDINGS=OFF -DWARNINGS_AS_ERRORS=ON
      - name: Build Ariadne
        shell: bash
        run: cmake --build build-ariadne --parallel 4 --target ariadne
      - name: Install Ariadne
        shell: bash
        run: cmake --install build-ariadne --prefix "$GITHUB_WORKSPACE/install"
      - name: Configure ARCH examples against installed Ariadne
        shell: bash
        run: cmake -S . -B build-suite -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install"
      - name: Compile suite (do not execute)
        shell: bash
        run: cmake --build build-suite --parallel 4
